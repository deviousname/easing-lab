name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-only:
    name: Core only / Python 3.13
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package without extras
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Confirm Pygame is absent and import the library
        run: python -c "import importlib.util; import easing_lab; assert importlib.util.find_spec('pygame') is None"

      - name: Check missing-designer guidance
        run: >-
          python -c "import subprocess;
          result = subprocess.run(['easing-lab'], capture_output=True, text=True);
          assert result.returncode != 0;
          assert 'pip install \"pygame-easing-lab[app]\"' in result.stderr, result.stderr"

      - name: Install test runner
        run: python -m pip install "pytest>=8.3"

      - name: Test standalone core
        run: pytest tests/test_core.py

  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    env:
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Build distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m build
