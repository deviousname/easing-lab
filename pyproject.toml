[build-system]
requires = ["hatchling>=1.27,<1.30"]
build-backend = "hatchling.build"

[project]
name = "easing-lab"
version = "0.1.0"
description = "Interactive Pygame easing designer and side-effect-free easing library"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [{ name = "Easing Lab contributors" }]
keywords = ["pygame", "easing", "animation", "gamedev", "interpolation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Multimedia :: Graphics",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
app = ["pygame>=2.6.1,<3"]
dev = [
  "build>=1.2.2",
  "pillow>=12.3",
  "easing-lab[app]",
  "pytest>=8.3",
  "ruff>=0.12",
]

[project.scripts]
easing-lab = "easing_lab.app:main"

[project.urls]
Homepage = "https://github.com/deviousname/easing-lab"
Issues = "https://github.com/deviousname/easing-lab/issues"
Source = "https://github.com/deviousname/easing-lab"

[tool.hatch.build.targets.sdist]
exclude = ["docs/easing-lab.gif", "docs/easing-lab.png", ".github", ".pytest-tmp"]

[tool.hatch.build.targets.wheel]
packages = ["src/easing_lab"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  ".pytest-tmp",
  ".release-venv",
  ".ruff_cache",
  ".uv-cache",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
